<!-- ===== O projeto ===== -->
<section id="projeto">
  <div class="ey">O projeto</div>
  <h2>Por que o Pega a Visão existe</h2>
  <p>Estudantes com necessidade de correção visual enfrentam dificuldades para ler, prestar atenção e aprender quando não têm óculos adequados. Para muitas famílias, o custo de uma armação nova é alto e, quando os óculos quebram, o conserto demora ou nem acontece.</p>
  <p>O projeto nasce na escola como uma iniciativa de aprendizagem STEM: os próprios estudantes da oficina produzem armações ecológicas, duráveis e ergonômicas com filamento de baixo custo e imprimem peças para consertar os óculos quebrados de quem já tem.</p>
  <h3 style="margin-top:1.5rem">Nossos objetivos</h3>
  <ul>
    <li><b style="color:var(--s1)">Reduzir o custo</b> dos óculos novos para as famílias.</li>
    <li><b style="color:var(--s4)">Ajudar na manutenção</b> de estudantes que já têm óculos e estão quebrados.</li>
    <li><b style="color:var(--s2)">Promover a aprendizagem STEM</b> com um problema real da comunidade.</li>
  </ul>
</section>

<!-- ===== Como funciona (os números nas bolinhas vêm do CSS) ===== -->
<section id="como">
  <div class="ey">Como funciona</div>
  <h2>Do pedido à entrega</h2>
  <p>Todo o acompanhamento fica em um só lugar, e o estudante vê em que etapa está o seu pedido de armação nova ou de conserto.</p>
  <ol class="steps">
    <li><b>Pedido.</b> O estudante ou o responsável pede uma armação nova ou o conserto de um óculos quebrado.</li>
    <li><b>Aceitação.</b> A equipe avalia o pedido e as medidas informadas.</li>
    <li><b>Modelagem.</b> A armação ou a peça de reparo é ajustada no computador.</li>
    <li><b>Impressão 3D.</b> A peça é impressa com filamento de baixo custo.</li>
    <li><b>Acabamento.</b> A equipe revisa e finaliza a peça.</li>
    <li><b>Entrega.</b> A armação vai direto ao estudante ou, se houver interesse em lentes com receita, para uma ótica parceira, com os custos das lentes informados antes.</li>
  </ol>
  <p class="mu">O projeto não faz diagnóstico: estudantes com sinais de dificuldade para enxergar devem ser encaminhados à família e a um profissional de saúde.</p>
</section>

<!-- ===== STEM ===== -->
<section id="stem">
  <div class="ey">Aprender fazendo</div>
  <h2>STEM na prática</h2>
  <div class="g3">

    <div><h3 style="color:var(--s3)">Tecnologia</h3><p class="mu">Modelagem e impressão 3D.</p></div>
    <div><h3 style="color:var(--s4)">Engenharia</h3><p class="mu">Projeto de uma armação ergonômica e durável.</p></div>
    <div><h3 style="color:var(--s2)">Matemática</h3><p class="mu">Medidas do rosto, escalas e ajuste de tamanho.</p></div>
  </div>
</section>

<!-- ===== ODS ===== (a cor de cada ODS vem das classes ods-cor-3, ods-cor-4 e ods-cor-12 em css/style.css) -->
<section id="ods">
  <div class="ey">Agenda 2030</div>
  <h2>Nossas ODS</h2>
  <p>O Pega a Visão contribui com os Objetivos de Desenvolvimento Sustentável (ODS) da ONU, em especial com a <b>ODS 3 (nosso objetivo principal)</b>, além das ODS 4 e 12.</p>
  <div class="g2">

    <article class="ods odm" aria-label="ODS 3: Saúde e Bem-Estar (ODS principal)">
      <div class="odh ods-cor-3"><small class="odp">ODS principal</small><b class="odn">ODS 3</b><span>Saúde e Bem-Estar</span></div>
      <div class="odc">
        <p class="mu"><b>Objetivo:</b> Assegurar uma vida saudável e promover o bem-estar para todos, em todas as idades.</p>
        <h3>Como contribuímos</h3>
        <ul>
          <li>Armações e consertos gratuitos para que estudantes possam corrigir a visão e cuidar da saúde visual.</li>
          <li>Encaminhamento a óticas parceiras para lentes com receita, com os custos informados antes às famílias.</li>
          <li>Acompanhamento de cada estudante atendido pelo painel da escola.</li>
        </ul>
      </div>
    </article>

    <article class="ods" aria-label="ODS 4: Educação de Qualidade">
      <div class="odh ods-cor-4"><b class="odn">ODS 4</b><span>Educação de Qualidade</span></div>
      <div class="odc">
        <p class="mu"><b>Objetivo:</b> Assegurar a educação inclusiva e equitativa e de qualidade, e promover oportunidades de aprendizagem ao longo da vida para todos.</p>
        <h3>Como contribuímos</h3>
        <ul>
          <li>Armações e consertos gratuitos para estudantes que precisam enxergar bem para aprender.</li>
          <li>Oficina STEM feita pelos próprios estudantes, com um problema real da comunidade.</li>
          <li>Painel da escola para acompanhar cada estudante atendido.</li>
        </ul>
      </div>
    </article>

    <article class="ods" aria-label="ODS 12: Consumo e Produção Responsáveis">
      <div class="odh ods-cor-12"><b class="odn">ODS 12</b><span>Consumo e Produção Responsáveis</span></div>
      <div class="odc">
        <p class="mu"><b>Meta 12.5:</b> Até 2030, reduzir substancialmente a geração de resíduos por meio da prevenção, redução, reciclagem e reuso.</p>
        <h3>Como contribuímos</h3>
        <ul>
          <li>Reciclagem: as armações usam filamento de baixo custo.</li>
          <li>Reuso: óculos quebrados são consertados com peças impressas em 3D, em vez de irem para o lixo.</li>
          <li>Prevenção: a impressão 3D sob demanda produz só o que foi pedido, sem desperdício.</li>
        </ul>
      </div>
    </article>

  </div>
</section>
